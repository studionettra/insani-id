name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Lewati unit/feature test (Hanya untuk rilis darurat)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: 🧪 Quality Gate (Pest & Pint)
    runs-on: ubuntu-latest
    if: "${{ !inputs.skip_tests }}"
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, dom, filter, gd, json, libxml, pdo, phar
          coverage: none

      - name: 📦 Install Composer Dependencies (Dev & Test)
        run: composer install --prefer-dist --no-interaction

      - name: 🎨 Run Laravel Pint (Code Style Check)
        run: vendor/bin/pint --test

      - name: 🧪 Run Pest Test Suite
        run: php artisan test --compact
        env:
          APP_ENV: testing
          APP_KEY: base64:xhK5RnvxVgHCN47F33EIOisGYAzw5xllBG5d+czSv64=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  deploy:
    name: 🚀 Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped' || inputs.skip_tests == true)
    env:
      TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH || format('/home/{0}/domains/{1}/laravel_app', secrets.HOSTINGER_USERNAME, secrets.HOSTINGER_DOMAIN || 'insani.id') }}
      APP_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN || 'insani.id' }}
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, libxml, pdo, phar
          coverage: none

      - name: 📦 Install Composer Dependencies (Production Only)
        run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Frontend Assets
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: 📂 Sync Files to Hostinger via rsync
        uses: easingthemes/ssh-deploy@v5.1.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          # Isolasi dan proteksi penuh untuk folder runtime storage, user upload, dan konfigurasi lokal
          EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, /.env, /storage/, /public/storage, /public/hot, *.sqlite"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USERNAME }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ env.TARGET_PATH }}

      - name: 🚀 Execute Artisan & Post-Deploy Tasks via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            set -e
            cd ${{ env.TARGET_PATH }}

            # Deteksi biner PHP 8.3 eksplisit Hostinger CloudLinux jika CLI default masih versi lama
            PHP_BIN="php"
            if [ -x "/opt/alt/php83/usr/bin/php" ]; then
              PHP_BIN="/opt/alt/php83/usr/bin/php"
            fi
            echo "Menggunakan PHP binary: $($PHP_BIN -v | head -n 1)"

            # Failsafe: Pastikan website selalu dibuka kembali jika script gagal di tengah jalan
            trap '$PHP_BIN artisan up || true' EXIT

            # Proteksi bypass secret: gunakan secret repository jika ada, atau buat acak per-run
            MAINTENANCE_SECRET="${{ secrets.APP_MAINTENANCE_SECRET }}"
            if [ -z "$MAINTENANCE_SECRET" ]; then
              MAINTENANCE_SECRET="deploy-$(openssl rand -hex 12)"
            fi

            echo "Entering maintenance mode..."
            $PHP_BIN artisan down --render="errors::503" --secret="$MAINTENANCE_SECRET" || true

            echo "Clearing configuration and application caches..."
            $PHP_BIN artisan optimize:clear

            echo "Running database migrations..."
            $PHP_BIN artisan migrate --force

            echo "Optimizing application caches..."
            $PHP_BIN artisan optimize
            $PHP_BIN artisan route:trans:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan event:cache

            # Memastikan symlink storage publik lokal laravel_app tersedia jika belum ada
            $PHP_BIN artisan storage:link || true

            # Sinkronkan folder build & aset publik ke public_html jika direktori terpisah
            PUBLIC_HTML_DIR="../public_html"
            if [ -d "$PUBLIC_HTML_DIR" ]; then
              echo "Menyinkronkan aset build ke $PUBLIC_HTML_DIR/build..."
              mkdir -p "$PUBLIC_HTML_DIR/build"
              rsync -av --delete public/build/ "$PUBLIC_HTML_DIR/build/" || cp -r public/build/* "$PUBLIC_HTML_DIR/build/"

              # Memastikan symlink storage di public_html mengarah ke laravel_app/storage/app/public
              if [ ! -L "$PUBLIC_HTML_DIR/storage" ] && [ ! -d "$PUBLIC_HTML_DIR/storage" ]; then
                echo "Membuat symlink storage di public_html..."
                ln -s "$(pwd)/storage/app/public" "$PUBLIC_HTML_DIR/storage" || true
              fi
            fi

            echo "Exiting maintenance mode..."
            $PHP_BIN artisan up

            # Reset trap karena proses deploy normal selesai
            trap - EXIT
            echo "Deployment completed successfully!"

      - name: 🩺 Automated Health Check Endpoint
        run: |
          echo "Checking application health at https://${APP_DOMAIN}/up..."
          HTTP_STATUS=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) GitHubActions/InsaniDeploy" -o /dev/null -w "%{http_code}" --max-time 15 "https://${APP_DOMAIN}/up" || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Health check passed with status $HTTP_STATUS"
          else
            echo "❌ Health check FAILED with status $HTTP_STATUS!"
            echo "Aplikasi tidak merespons secara sehat (status HTTP bukan 200)."
            exit 1
          fi
